<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Waymark · 个人求职工作空间</title>
  <desc id="desc">浅蓝色航图上的山海与金色航标。将岗位、投递进度与面试笔记收在一处。</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2=".3" gradientUnits="objectBoundingBox">
      <stop stop-color="#f9fbf9"/><stop offset=".52" stop-color="#eff7f9"/><stop offset="1" stop-color="#d9edf5"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#b6dae9"/><stop offset=".65" stop-color="#e5f4f6"/><stop offset="1" stop-color="#f9f5e0"/>
    </linearGradient>
    <linearGradient id="water" x2=".7" y2="1">
      <stop stop-color="#8cc5d9"/><stop offset=".5" stop-color="#bde5ed"/><stop offset="1" stop-color="#dcf1f4"/>
    </linearGradient>
    <linearGradient id="ridge" x2="1" y2=".5">
      <stop stop-color="#22688b"/><stop offset="1" stop-color="#75b7ca"/>
    </linearGradient>
    <pattern id="chart" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#446e82" stroke-width=".8" opacity=".22"/>
      <circle r="1.2" fill="#6993a4" opacity=".35"/>
    </pattern>
    <clipPath id="lens"><circle cx="898" cy="200" r="148"/></clipPath>
    <path id="star" d="M0 -12Q2 -2 12 0Q2 2 0 12Q-2 2 -12 0Q-2 -2 0 -12Z"/>
  </defs>
  <rect width="1200" height="400" fill="url(#paper)"/>
  <path d="M668 0H1200V400H573Z" fill="url(#chart)" opacity=".72"/>
  <g fill="none" stroke="#80a3b3" stroke-width="1">
    <circle cx="898" cy="200" r="190" opacity=".38"/>
    <circle cx="898" cy="200" r="173" opacity=".55" stroke-dasharray="1 7"/>
    <path d="M682 200h432M898 0v400" opacity=".38" stroke-dasharray="6 7"/>
  </g>
  <g clip-path="url(#lens)">
    <rect x="740" y="45" width="317" height="310" fill="url(#sky)"/>
    <circle cx="949" cy="159" r="29" fill="#fff4d5"/>
    <path d="M713 247l119-74q8-5 18 0l38 22 64-47q7-6 15 0l88 66v44Z" fill="#97c7d7"/>
    <path d="M706 152l62 20 66 52 39-21q7-4 14 1l89 61H706Z" fill="#71adbf"/>
    <path d="M709 201l42-18q8-3 15 1l90 62 38-16q9-3 15 2l57 36H709Z" fill="url(#ridge)"/>
    <path d="M714 228q23-21 53-8l71 32 44 9H714Z" fill="#245c75"/>
    <path d="M727 259q80-8 152-4t195 0v107H727Z" fill="url(#water)"/>
    <path d="m778 272 93-3-21 5Zm74 17 91-3 36 3-94 3Zm-44 23 99-3-35 7Zm73-45 49-2 32 2-44 2Z" fill="#edf9f8" opacity=".9"/>
    <path d="M752 326c45-37 106 12 147-26s-18-51 18-82l26-22" fill="none" stroke="#255a75" stroke-width="2" stroke-dasharray="4 5"/>
    <use href="#star" x="945" y="194" fill="#c08b31" stroke="#fff4d0" stroke-width="1.4"/>
  </g>
  <circle cx="898" cy="200" r="148" fill="none" stroke="#648b9d" stroke-width="1.4"/>
  <g stroke="#50768a" stroke-width="2"><path d="M898 39v8m0 306v8M737 200h8m306 0h8"/></g>
  <use href="#star" x="1067" y="111" fill="#b38c48" transform="rotate(12 1067 111)"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#123a53">
    <path d="M70 72h37" stroke="#a47a34" stroke-width="3"/>
    <text x="122" y="81" font-size="23" letter-spacing="4">个人求职工作空间</text>
    <text x="63" y="221" font-family="Georgia,'Times New Roman',serif" font-size="124" font-weight="bold" letter-spacing="-6">Waymark</text>
    <text x="70" y="288" font-size="35" font-weight="500" letter-spacing="1">岗位跟进与面试准备</text>
    <path d="M72 337h475" stroke="#a5bfca" stroke-width="1"/>
    <circle cx="72" cy="337" r="3" fill="#b48d48"/>
  </g>
</svg>
