name: waymark
services:
  app:
    build: .
    image: waymark-local:1
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WAYMARK_PORT:-4173}:5173'
    volumes:
      - type: bind
        source: ${WAYMARK_DATA_DIR:-./data}
        target: /var/lib/waymark
      - type: bind
        source: ./private
        target: /run/waymark-private
        read_only: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 4s
      start_period: 5s
      retries: 3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
